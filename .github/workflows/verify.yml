# Rebuilds both datasets from the official sources and checks every exercise on real PostgreSQL and MySQL.
# A change that breaks any solution, or makes the two databases disagree, fails this workflow.
name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start MySQL 8.4
        run: |
          docker run --name sql-playbook-mysql -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -p 127.0.0.1:3306:3306 -d mysql:8.4
          # The image first runs a temporary init server without networking, then restarts.
          # Wait until the final server answers over TCP, the way the scripts connect.
          for i in $(seq 1 90); do
            docker exec sql-playbook-mysql mysql --protocol=TCP -h127.0.0.1 -uroot -e 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec sql-playbook-mysql mysql --protocol=TCP -h127.0.0.1 -uroot -e 'select version()'

      - name: Download the official dataset sources
        run: |
          mkdir -p datasets/raw
          curl -sSfL -o datasets/raw/sakila-db.tar.gz https://downloads.mysql.com/docs/sakila-db.tar.gz
          tar -xzf datasets/raw/sakila-db.tar.gz -C datasets/raw
          # Chinook is pinned to release v1.4.5; the release file uses Windows line endings.
          curl -sSfL https://raw.githubusercontent.com/lerocha/chinook-database/v1.4.5/ChinookDatabase/DataSources/Chinook_MySql.sql \
            | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' > datasets/raw/Chinook_MySql.sql
          # Northwind: Microsoft's official script, pinned to the commit that last changed it (April 2023).
          curl -sSfL -o datasets/raw/instnwnd.sql \
            https://raw.githubusercontent.com/microsoft/sql-server-samples/2f85f3724ee45776a5183ed34d064488a6e1dc53/samples/databases/northwind-pubs/instnwnd.sql
          # Employees: datacharmer/test_db pinned to a commit; the build loads it in full and samples it.
          mkdir -p datasets/raw/test_db
          curl -sSfL https://github.com/datacharmer/test_db/archive/e324b56193ca506ab7cc1ab143a9153d8c4535d7.tar.gz \
            | tar -xz -C datasets/raw/test_db --strip-components=1
          # AdventureWorks: the release asset has no commit to pin to, so its checksum is verified instead.
          curl -sSfL -o datasets/raw/aw.zip \
            https://github.com/microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks-oltp-install-script.zip
          echo "58962e94ea386ef7cd3d8a08211bfd42a79d9b81bdd68fd4b6b0051de6c5bd42  datasets/raw/aw.zip" | sha256sum -c
          mkdir -p datasets/raw/aw && unzip -q datasets/raw/aw.zip -d datasets/raw/aw
          # Airlines: the Postgres Pro demo database (a PostgreSQL dump); the file is not versioned, so its checksum is verified.
          curl -sSfL -o datasets/raw/demo-20250901-3m.sql.gz https://edu.postgrespro.ru/demo-20250901-3m.sql.gz
          echo "fe341811a2f8e19765b9841accda7652ee897cbc7e7f749496d82a32e9729e9b  datasets/raw/demo-20250901-3m.sql.gz" | sha256sum -c
          # Lahman: SABR publishes the CSV files in a Box folder without versions, so each file's checksum is verified.
          sh scripts/download-lahman.sh

      - name: Rebuild datasets (PostgreSQL and MySQL builds must match row by row)
        run: npm run build:datasets

      - name: Committed dataset files are up to date
        run: git diff --exit-code -- public/datasets datasets/build src/content/datasets

      - name: Verify every exercise on PostgreSQL and MySQL
        run: npm run verify

      - run: npm run typecheck

      - run: npm run build
