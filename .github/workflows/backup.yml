# Weekly backup of the Supabase database (accounts, progress, reminder subscriptions), encrypted before it leaves the
# runner: the repository is public, so the artifact must be unreadable without the passphrase.
# Secrets (repository settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the "Session pooler" connection string from Supabase → Connect (works over IPv4)
#   BACKUP_PASSPHRASE   a long random passphrase, also kept in the owner's password manager — without it a backup
#                       cannot be opened
# Restore: gpg --decrypt backup.dump.gpg > backup.dump && pg_restore --clean --if-exists -d "<connection string>" backup.dump
name: Backup

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump the public and auth schemas (PostgreSQL 17, like the server)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is not set"; exit 1; }
          # Spaces or line breaks around a pasted secret are dropped; the value itself is never printed.
          SUPABASE_DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '[:space:]')"
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_URL must start with postgresql:// (copy the whole Session pooler string)"; exit 1 ;;
          esac
          case "$SUPABASE_DB_URL" in
            *'[YOUR-PASSWORD]'*) echo "SUPABASE_DB_URL still contains [YOUR-PASSWORD]: put the database password there"; exit 1 ;;
          esac
          export SUPABASE_DB_URL
          docker run --rm -e SUPABASE_DB_URL -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --schema=public --schema=auth --no-owner --no-privileges --format=custom --file=/out/backup.dump'
          ls -l backup.dump

      - name: Encrypt it
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 --output backup.dump.gpg backup.dump <<< "$BACKUP_PASSPHRASE"
          shred -u backup.dump
          ls -l backup.dump.gpg

      - name: Keep it for 90 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup.dump.gpg
          retention-days: 90
