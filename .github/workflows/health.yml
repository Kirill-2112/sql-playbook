# Every six hours, checks that the app and its API answer. A failed run makes GitHub email the repository owner,
# so a broken deploy or a missing setting is noticed before learners notice it.
name: Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The app, its sign-in settings and the reminder key answer
        run: |
          set -e
          for path in "" "api/config" "api/push/key"; do
            curl --fail --silent --show-error --max-time 30 -o /dev/null "https://sql.kirillabs.com/$path"
            echo "ok /$path"
          done
